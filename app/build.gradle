plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.techbuddy.snkrlab3'
    compileSdkVersion 34

    sourceSets {
        // Define the 'test' SourceSet
        test {
            java.srcDirs = ['src/test/java'] // Example test source directory
            resources.srcDirs = ['src/test/resources'] // Example test resources directory
            // Other configurations specific to your test SourceSet
        }
    }
    defaultConfig {
        applicationId "com.techbuddy.snkrlab3"
        minSdkVersion androidMinSdkVersion
        targetSdkVersion androidTargetSdkVersion
        versionCode cameraKitDistributionCode
        versionName cameraKitDistributionVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // These fields are preserved from the first block
        buildConfigField 'String', "LENS_GROUP_ID_TEST", "\"$cameraKitLensesGroupId\""
        buildConfigField 'String', "CAMERA_KIT_API_TOKEN", "\"$cameraKitApiToken\""
    }

    buildFeatures {
        buildConfig true // Add this line to enable BuildConfig generation
        // Other build features configuration if needed
    }

    signingConfigs {
        debug {
            storeFile file('C:/Users/Personal/.android/debug.keystore')
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Ensure that the signingConfig is included
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Include signingConfigs from the first block
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}

task testClasses(type: JavaCompile) {
    description = 'Compile test classes'
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    classpath = files()
    android.sourceSets.getByName('test').java.srcDirs.each { dir ->
        classpath += files(dir)
    }
}



dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Include dependencies from the first block, ensuring no duplicates
    implementation "androidx.core:core-ktx:$ktxVersion"
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    implementation "com.google.android.exoplayer:exoplayer-core:$exoPlayerVersion"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoPlayerVersion"
    implementation "com.google.android.material:material:$materialVersion"

    implementation "com.snap.camerakit:camerakit:$cameraKitVersion"
    implementation "com.snap.camerakit:support-snap-button:$cameraKitVersion"
    implementation "com.snap.camerakit:support-permissions:$cameraKitVersion"
    implementation "com.snap.camerakit:support-camerax:$cameraKitVersion"
    implementation "com.snap.camerakit:support-snap-attribution:$cameraKitVersion"
}
